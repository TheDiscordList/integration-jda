name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Compiles with -Xlint:all -Werror, so a warning fails the build.
      - run: mvn -B verify
      - name: Compile the example
        run: |
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          javac -proc:none -Xlint:all -Werror -d target/examples -cp "target/classes:$(cat cp.txt)" examples/*.java
      - name: Javadoc and sources
        run: mvn -B -P release -Dgpg.skip -DskipTests package

  jda-floor:
    name: Oldest supported JDA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify -Djda.version=5.0.0
